// Fabric client for Shulker Styles: draws patterns and labels on shulker boxes for servers running the plugin.
// Separate Gradle build (Loom needs its own Gradle setup, apart from the Paper plugin build).
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base { archivesName = 'shulker-styles-client' }

// The protocol and box model (dev.whizzle.shulker.model) are shared source with the plugin, so both sides encode
// and decode every message with the same code.
sourceSets {
	main {
		java {
			srcDir '../shulker-plugin/src/main/java'
			include 'dev/whizzle/shulker/client/**', 'dev/whizzle/shulker/model/**'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	testImplementation "org.junit.jupiter:junit-jupiter:6.1.3"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test { useJUnitPlatform() }

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
